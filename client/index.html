<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Voice AI Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Мета-теги для улучшенной работы в Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#667eea" />
  </head>
  <body>
    <script src="https://telegram.org/js/telegram-web-app.js?57"></script>
    <div class="status-bar">
      <button id="startDialog" class="main-button">🎤</button>
      <button id="mainMenu" class="main-menu-button">☰</button>
      <div class="visual-container">
        <div id="micVisualSection" class="visual-section">
          <canvas
            id="micCanvas"
            class="audio-canvas"
            width="300"
            height="60"
          ></canvas>
        </div>
      </div>
      <div id="status">Готов к работе</div>
      <input id="passwd" />
    </div>

    <div class="container">
      <div id="transcriptSection">
        <div id="transcriptOutput"></div>
      </div>

      <div class="input-container">
        <input
          disabled
          type="text"
          id="textInput"
          placeholder="Введите ваше сообщение..."
        />
        <button disabled id="sendButton">Отправить</button>
      </div>
    </div>

    <div id="loader" class="loader">
      <div class="loader-spinner"></div>
      <div id="loaderText">Загрузка...</div>
    </div>

    <!-- Улучшенный аудио элемент для Android -->
    <audio
      id="remoteAudio"
      autoplay
      playsinline
      preload="none"
      style="display: none"
    ></audio>
    <script src="scripts/handleTelegram.js"></script>
    <script src="scripts/vizualizeComponents.js"></script>
    <script src="scripts/sendLoger.js"></script>
    <script src="scripts/addTrancript.js"></script>
    <script src="scripts/mainScript.js"></script>
    <script src="scripts/mobileDebugger.js"></script>
  </body>
</html>
